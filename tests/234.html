<style>

.tab.on{border-color:var(--red);background:var(--red2)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}

.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password]{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
input.zh{font-size:20px}

.hero{font-size:44px;line-height:1}

.mgrid{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px}
.mcol h3{font-size:13px;color:var(--mut);margin:0 0 4px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.mi{position:relative;display:block;width:100%;text-align:left;font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 34px 8px 10px;margin:0 0 6px;cursor:pointer;min-height:42px}
.mi.h{font-size:22px}
.mi.act{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel2)}
.mi .b{position:absolute;right:8px;top:50%;transform:translateY(-50%);min-width:22px;height:22px;border-radius:11px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.round{margin:0 0 18px}
.round>b{display:block;margin:0 0 6px}
/* build */
.item{border-top:1px dashed var(--line);padding:14px 0}
.item:first-of-type{border-top:0}
.ru{font-weight:600;margin:0 0 8px}
.ans{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.pool{display:flex;gap:6px;flex-wrap:wrap}
.tile{font:inherit;font-size:20px;border:1px solid var(--line);background:#fffaf0;border-radius:10px;padding:6px 12px;cursor:pointer}
.tile.used{visibility:hidden}
.ans .tile{background:var(--sel2);border-color:var(--sel)}
/* choice */
.zhq{font-size:24px;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;margin:0 0 6px;cursor:pointer}
.opt.on{border-color:var(--sel);background:var(--sel2);font-weight:600}
.nav{display:flex;justify-content:space-between;gap:10px;margin:8px 0 30px}
/* overlay */
.ov{position:fixed;inset:0;background:rgba(30,20,15,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.ov .card{max-width:460px;text-align:center}
.big{font-size:48px}
/* result */
.res td,.res th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.res{border-collapse:collapse;width:100%}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:28px;letter-spacing:.15em;background:#fff8e6;border:1px dashed var(--gold);border-radius:10px;padding:6px 14px;display:inline-block}
.ok{color:var(--ok)}.bad{color:var(--red)}
.hide{display:none!important}
.small{font-size:14px;color:var(--mut)}
@media (max-width:620px){
  .mgrid{grid-template-columns:1fr 1fr;}
  .mcol.tr{grid-column:1 / span 2}
  .mi.h{font-size:20px}
}

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function range(n){var a=[];for(var i=0;i<n;i++)a.push(i);return a}
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function norm(s){return String(s||"").replace(/[\s，。？！、,.?!；;：:“”"'…·—\-（）()]/g,"")}
function hash(str){var h=0x811c9dc5;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h}
function codeOf(name,score,total,exits,secs){var h=hash(SALT+"|"+name.trim().toLowerCase()+"|"+score+"|"+total+"|"+exits+"|"+secs);return h.toString(36).toUpperCase().padStart(7,"0").slice(-6)}
function fmt(ms){ms=Math.max(0,ms);var s=Math.ceil(ms/1000);var m=Math.floor(s/60);s%=60;return (m<10?"0":"")+m+":"+(s<10?"0":"")+s}

function newSession(name){
  var seed=(Date.now()^Math.floor(Math.random()*1e9))>>>0, r=rng(seed);
  var w=shuffle(range(WORDS.length),r).slice(0,12);
  var b=shuffle(range(BUILD.length),r).slice(0,6);
  var zr=shuffle(range(ZR.length),r).slice(0,5);
  var rz=shuffle(range(RZ.length),r).slice(0,5);
  var rounds=[w.slice(0,6),w.slice(6)].map(function(ids){return{ids:ids,py:shuffle(ids,r),tr:shuffle(ids,r)}});
  return{name:name,seed:seed,start:Date.now(),exits:0,done:false,sec:0,
    rounds:rounds,match:[{},{}],
    build:b.map(function(i){return{i:i,order:shuffle(range(BUILD[i][0].length),r),ans:[]}}),

    rz:rz.map(function(i){return{i:i,txt:""}})};
}

/* ---------- anti-cheat ---------- */
var running=false, lastV=0, fsEntered=false, finishing=false;
function block(e){if(running){e.preventDefault();return false}}
["copy","cut","paste","contextmenu","dragstart","drop"].forEach(function(ev){document.addEventListener(ev,block,true)});

  if(!running)return;

  if(k==="f12")e.preventDefault();

function violation(why){
  if(!running||finishing)return;
  var now=Date.now(); if(now-lastV<1500)return; lastV=now;
  S.exits++; save(); updExits();
  if(S.exits>=MAX_EXITS){finish("Тест завершён досрочно: вы вышли из него "+S.exits+" раза.");return}

}

document.addEventListener("visibilitychange",function(){if(document.visibilityState==="hidden")violation("Вы переключились на другую вкладку или приложение.")});
document.addEventListener("fullscreenchange",function(){if(fsEntered&&!document.fullscreenElement)violation("Вы вышли из полноэкранного режима.")});
document.addEventListener("webkitfullscreenchange",function(){if(fsEntered&&!document.webkitFullscreenElement)violation("Вы вышли из полноэкранного режима.")});
window.addEventListener("beforeunload",function(e){if(running){e.preventDefault();e.returnValue=""}});
function goFS(){
  var d=document.documentElement, f=d.requestFullscreen||d.webkitRequestFullscreen;
  if(!f)return;
  try{var p=f.call(d);if(p&&p.then)p.then(function(){fsEntered=true}).catch(function(){});else fsEntered=true}catch(e){}
}

function counts(){

  main.appendChild(nav);
}

/* matching */
var act=[null,null];
function rMatch(c){
  c.appendChild(el("p","lead","Нажмите на иероглиф, затем на его пиньинь и на перевод — у всех троих появится одинаковый номер. Чтобы отменить выбор, нажмите на пиньинь или перевод ещё раз."));
  S.rounds.forEach(function(rd,k){
    var box=el("div","round");box.appendChild(el("b",null,"Раунд "+(k+1)));
    var g=el("div","mgrid"), ch=el("div","mcol"), cp=el("div","mcol"), ct=el("div","mcol tr");
    ch.appendChild(el("h3",null,"Иероглифы"));cp.appendChild(el("h3",null,"Пиньинь"));ct.appendChild(el("h3",null,"Перевод"));
    var mp=S.match[k], num={};
    rd.ids.forEach(function(id,n){num[id]=n});
    function badge(n){return '<span class="b" style="background:'+COLORS[n]+'">'+(n+1)+"</span>"}
    function owner(field,val){for(var h in mp){if(mp[h][field]===val)return +h}return null}
    rd.ids.forEach(function(id){
      var b=el("button","mi h z"+(act[k]===id?" act":""),esc(WORDS[id][0])+badge(num[id]));
      b.onclick=function(){act[k]=(act[k]===id?null:id);render()};
      ch.appendChild(b);
    });
    [["p",rd.py,1,cp],["t",rd.tr,2,ct]].forEach(function(cfg){
      var field=cfg[0];
      cfg[1].forEach(function(val){
        var o=owner(field,val);
        var b=el("button","mi",esc(WORDS[val][cfg[2]])+(o!=null?badge(num[o]):""));
        b.onclick=function(){
          if(o!=null){mp[o][field]=null;if(act[k]==null)act[k]=o}
          else if(act[k]!=null){mp[act[k]]=mp[act[k]]||{};mp[act[k]][field]=val}
          else{return flash(box)}
          save();render();
        };
        cfg[3].appendChild(b);
      });
    });
    g.appendChild(ch);g.appendChild(cp);g.appendChild(ct);box.appendChild(g);c.appendChild(box);
  });
}
function flash(box){var p=box.querySelector(".mcol");p.style.outline="2px solid #b8322a";setTimeout(function(){p.style.outline=""},500)}

/* build */
function rBuild(c){
  c.appendChild(el("p","lead","Нажимайте на слова по порядку. Чтобы убрать слово, нажмите на него в строке ответа."));
  S.build.forEach(function(it,n){
    var B=BUILD[it.i], d=el("div","item");
    d.appendChild(el("p","ru",(n+1)+". "+esc(B[2])));
    var ans=el("div","ans"), pool=el("div","pool");
    it.ans.forEach(function(ti,pos){var t=el("button","tile z",esc(B[0][ti]));t.onclick=function(){it.ans.splice(pos,1);save();render()};ans.appendChild(t)});
    it.order.forEach(function(ti){var t=el("button","tile z"+(it.ans.indexOf(ti)>=0?" used":""),esc(B[0][ti]));t.onclick=function(){if(it.ans.indexOf(ti)<0){it.ans.push(ti);save();render()}};pool.appendChild(t)});
    d.appendChild(ans);d.appendChild(pool);c.appendChild(d);
  });
}

/* zh -> ru */
function rZR(c){
  c.appendChild(el("p","lead","Выберите правильный перевод."));
  S.zr.forEach(function(it,n){
    var Q=ZR[it.i], d=el("div","item");
    d.appendChild(el("p","zhq z",(n+1)+". "+esc(Q[0])));
    it.order.forEach(function(oi){
      var b=el("button","opt"+(it.pick===oi?" on":""),esc(Q[1][oi]));
      b.onclick=function(){it.pick=oi;save();render()};d.appendChild(b);
    });
    c.appendChild(d);
  });
}

/* ru -> zh */
function rRZ(c){
  c.appendChild(el("p","lead","Напишите перевод иероглифами (на китайской раскладке). Знаки препинания и пробелы не важны."));
  S.rz.forEach(function(it,n){
    var Q=RZ[it.i], d=el("div","item");
    d.appendChild(el("p","ru",(n+1)+". "+esc(Q[0])));
    var inp=el("input","zh z");inp.type="text";inp.value=it.txt;inp.setAttribute("autocomplete","off");inp.setAttribute("autocorrect","off");inp.setAttribute("spellcheck","false");
    inp.oninput=function(){it.txt=inp.value;save();renderTabs()};
    d.appendChild(inp);c.appendChild(d);
  });
}

function askFinish(){
  var cs=counts(), empty=cs.reduce(function(a,x){return a+(x[1]-x[0])},0);
  main.innerHTML="";
  var c=el("div","card");
  c.innerHTML='<h2>Завершить тест?</h2><p>'+(empty?'Без ответа осталось заданий: <b>'+empty+'</b>.':'Вы ответили на все задания.')+' После завершения изменить ответы будет нельзя.</p>';
  var r=el("div","row"), y=el("button","btn","Да, завершить"), n=el("button","btn ghost","Вернуться");
  y.onclick=function(){finish("")};n.onclick=function(){render()};
  r.appendChild(y);r.appendChild(n);c.appendChild(r);main.appendChild(c);
}

/* ---------- scoring ---------- */
function score(){
  var m=0;S.rounds.forEach(function(rd,k){rd.ids.forEach(function(id){var a=S.match[k][id];if(a&&a.p===id&&a.t===id)m++})});
  var b=0, bl=[];S.build.forEach(function(it){var B=BUILD[it.i];var s=it.ans.map(function(t){return B[0][t]}).join("");var ok=it.ans.length===B[0].length&&B[1].indexOf(s)>=0;if(ok)b++;bl.push([B[2],s,ok])});
  var z=0, zl=[];S.zr.forEach(function(it){var ok=it.pick===0;if(ok)z++;zl.push([ZR[it.i][0],it.pick==null?"—":ZR[it.i][1][it.pick],ok])});
  var r=0, rl=[];S.rz.forEach(function(it){var Q=RZ[it.i];var ok=Q[1].indexOf(norm(it.txt))>=0;if(ok)r++;rl.push([Q[0],it.txt||"—",ok])});
  return{m:m,b:b,z:z,r:r,total:m+b+z+r,max:28,bl:bl,zl:zl,rl:rl};
}

function finish(msg){
  if(!S||S.done&&running===false){}
  finishing=true; running=false; clearInterval(tmr);
  document.getElementById("ov").classList.remove("on");
  if(!S.done){S.done=true;S.sec=Math.min(LIMIT,Date.now()-S.start)/1000|0;S.msg=msg||"";save()}
  try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen()}catch(e){}
  document.body.classList.remove("locked");
  result();
}

function result(){
  document.getElementById("top").classList.add("hide");
  var R=score(), code=codeOf(S.name,R.total,R.max,S.exits,S.sec);
  var pct=Math.round(R.total/R.max*100), em=pct>=85?"🏆":pct>=70?"👍":pct>=50?"🙂":"📚";
  var mm=Math.floor(S.sec/60), ss=S.sec%60;
  main.innerHTML="";
  var c=el("div","card");
  var h='<div class="hero">'+em+'</div><h1>Тест завершён</h1>'+
   (S.msg?'<p class="bad">'+esc(S.msg)+'</p>':'')+
   '<table class="res">'+
   '<tr><th>Ученик</th><td><b>'+esc(S.name)+'</b></td></tr>'+
   '<tr><th>Результат</th><td><b>'+R.total+' из '+R.max+'</b> ('+pct+'%)</td></tr>'+
   '<tr><th>🧩 Слова</th><td>'+R.m+' / 12</td></tr>'+
   '<tr><th>🧱 Предложения</th><td>'+R.b+' / 6</td></tr>'+
   '<tr><th>📖 Кит → рус</th><td>'+R.z+' / 5</td></tr>'+
   '<tr><th>✍️ Рус → кит</th><td>'+R.r+' / 5</td></tr>'+
   '<tr><th>⏱ Время</th><td>'+mm+' мин '+ss+' с</td></tr>'+
   '<tr><th>🚪 Выходов из теста</th><td>'+S.exits+'</td></tr>'+
   '</table>'+
   '<p style="margin-top:14px">Проверочный код: <span class="code">'+code+'</span></p>'+
   '<p class="small">Сделайте скриншот этого экрана и отправьте преподавателю.</p>';
  h+='<h2 style="margin-top:18px">Ваши ответы</h2><p class="small">✓ — верно, ✗ — неверно. Правильные варианты разберёте с преподавателем.</p>';
  h+='<p><b>🧱 Предложения</b></p>'+R.bl.map(function(x){return '<div>'+(x[2]?'<span class="ok">✓</span>':'<span class="bad">✗</span>')+' '+esc(x[0])+' — <span class="z">'+esc(x[1]||"—")+'</span></div>'}).join("");
  h+='<p><b>📖 Кит → рус</b></p>'+R.zl.map(function(x){return '<div>'+(x[2]?'<span class="ok">✓</span>':'<span class="bad">✗</span>')+' <span class="z">'+esc(x[0])+'</span> — '+esc(x[1])+'</div>'}).join("");
  h+='<p><b>✍️ Рус → кит</b></p>'+R.rl.map(function(x){return '<div>'+(x[2]?'<span class="ok">✓</span>':'<span class="bad">✗</span>')+' '+esc(x[0])+' — <span class="z">'+esc(x[1])+'</span></div>'}).join("");
  c.innerHTML=h;
  var t=el("div","card");
  t.innerHTML='<p class="small">Для преподавателя: чтобы на этом устройстве начал тест другой ученик, введите PIN.</p>';
  var r=el("div","row"), p=el("input");p.type="password";p.placeholder="PIN";p.style.maxWidth="140px";
  var b=el("button","btn ghost","Новый ученик");
  b.onclick=function(){if(p.value===PIN){try{localStorage.removeItem(KEY)}catch(e){}S=null;finishing=false;fsEntered=false;startScreen()}else{p.value="";p.placeholder="неверный PIN"}};
  r.appendChild(p);r.appendChild(b);t.appendChild(r);
  main.appendChild(c);main.appendChild(t);
}

/* ---------- boot ---------- */
S=load();
if(S&&S.done){result()}
else if(S){
  if(Date.now()-S.start>=LIMIT){finish("Время вышло. Тест завершён, засчитаны ответы, которые вы успели дать.")}
  else{
    run();
    S.exits++;save();updExits();
    if(S.exits>=MAX_EXITS)finish("Тест завершён досрочно: вы вышли из него "+S.exits+" раза.");
    else showOv("Страница была перезагружена или закрыта.");
  }
}
else startScreen();
})();
</script>
</body>
